<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" fill="none">
  <!-- Document / Spreadsheet Icon -->
  <g transform="translate(10, 8)">
    <!-- Document Body with folded top-right corner -->
    <path d="M 12 0 C 5.373 0 0 5.373 0 12 L 0 112 C 0 118.627 5.373 124 12 124 L 92 124 C 98.627 124 104 118.627 104 112 L 104 36 L 68 0 Z" fill="#16a34a"/>
    <!-- Folded corner flap -->
    <path d="M 68 0 L 104 36 L 80 36 C 73.373 36 68 30.627 68 24 Z" fill="#15803d"/>
    <!-- Spreadsheet Grid Container -->
    <rect x="16" y="44" width="72" height="64" rx="8" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Grid rows/columns -->
    <!-- Col 1, Row 1 -->
    <rect x="22" y="50" width="28" height="14" rx="3" fill="#16a34a"/>
    <!-- Col 2, Row 1 -->
    <rect x="54" y="50" width="28" height="14" rx="3" fill="#16a34a"/>
    <!-- Col 1, Row 2 -->
    <rect x="22" y="69" width="28" height="14" rx="3" fill="#16a34a"/>
    <!-- Col 2, Row 2 -->
    <rect x="54" y="69" width="28" height="14" rx="3" fill="#16a34a"/>
    <!-- Col 1, Row 3 -->
    <rect x="22" y="88" width="28" height="14" rx="3" fill="#16a34a"/>
    <!-- Col 2, Row 3 -->
    <rect x="54" y="88" width="28" height="14" rx="3" fill="#16a34a"/>
  </g>
  <!-- Wordmark "Staty" in Dark Navy -->
  <text x="145" y="100" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="105" font-weight="900" fill="#1e293b" letter-spacing="-2">Staty</text>
</svg>
